<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Business Decision Lab｜跨產業行銷P&amp;L決策分析</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <span class="en">Business Decision Lab</span>
      <span class="zh">跨產業行銷P&amp;L決策分析</span>
      <span class="sub">Turn Marketing Decisions into Commercial Outcomes</span>
    </div>
    <div class="tabs">
      <button data-route="dashboard" onclick="App.navigate('dashboard')">Dashboard</button>
      <button data-route="library" onclick="App.navigate('library')">Case Library</button>
      <button data-route="workspace" onclick="App.navigate('workspace','phai-001')">Workspace</button>
      <button data-route="progress" onclick="App.navigate('progress')">Progress</button>
      <button data-route="portfolio" onclick="App.navigate('portfolio')">Portfolio</button>
      <button data-route="data" onclick="App.navigate('data')">資料管理</button>
    </div>
    <div class="topbar-right">
      <div class="save-indicator"><span class="save-dot"></span><span id="saveIndicator">尚未儲存任何紀錄</span></div>
    </div>
  </div>

  <main>
    <div id="appRoot"></div>
    <p class="footer-note">
      Business Decision Lab v1（MVP）— 資料儲存在本機瀏覽器（localStorage），請定期使用「資料管理」頁面匯出JSON備份。<br/>
      本系統所有模擬案例僅參考公開市場常識與公開資料建立，非任何真實公司之機密資料，亦非Harvard Business Publishing原始案例之重製。
    </p>
  </main>

  <script src="js/engine.js"></script>
  <script src="js/store.js"></script>
  <script src="js/cases.js"></script>
  <script src="js/coach-content.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
