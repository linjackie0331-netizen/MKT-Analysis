<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>Business Decision Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* Business Decision Lab — visual system
   A commercial-finance instrument, not a dashboard toy: navy/ink surfaces,
   a serif for authority (Fraunces), plain sans for working text (IBM Plex Sans),
   monospaced tabular figures for every P&L number (IBM Plex Mono). */

:root {
  /* brand blocks — topbar, kpi tiles, primary buttons: deliberately constant
     across themes, always paired with --on-brand text */
  --navy: #10233f;
  --tile-alt: #3a4048;
  --on-brand: #ffffff;

  /* adaptive accent — links, small fills, thin borders */
  --navy-2: #1c3a63;
  /* navy used as TEXT sitting on an adaptive surface (headings, labels) */
  --heading: #10233f;

  /* adaptive surfaces + text */
  --ink: #12161c;
  --ink-2: #333c46;
  --muted: #6b7280;
  --paper: #f2f4f7;
  --surface: #ffffff;
  --surface-2: #eef1f4;
  --line: #dde1e6;

  /* semantic status — separate from the brand accent */
  --good: #1f6f43;
  --bad: #a5311f;
  --warn: #8a5a10;

  --disclosure-bg: #fff8ea;
  --disclosure-border: #e8d9ab;
  --disclosure-text: #6b5311;

  --radius: 4px;
  --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --navy-2: #6fa0dc;
    --heading: #9dc1ec;
    --ink: #e8ecf1;
    --ink-2: #c3ccd6;
    --muted: #8b97a8;
    --paper: #0b121c;
    --surface: #121c2b;
    --surface-2: #182333;
    --line: #263450;
    --good: #4fbf8a;
    --bad: #e2685a;
    --warn: #d8a13f;
    --disclosure-bg: #2c2410;
    --disclosure-border: #5c4a1a;
    --disclosure-text: #e8c877;
  }
}
:root[data-theme="dark"] {
  --navy-2: #6fa0dc;
  --heading: #9dc1ec;
  --ink: #e8ecf1;
  --ink-2: #c3ccd6;
  --muted: #8b97a8;
  --paper: #0b121c;
  --surface: #121c2b;
  --surface-2: #182333;
  --line: #263450;
  --good: #4fbf8a;
  --bad: #e2685a;
  --warn: #d8a13f;
  --disclosure-bg: #2c2410;
  --disclosure-border: #5c4a1a;
  --disclosure-text: #e8c877;
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-body);
  background: var(--paper);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.55;
}
a { color: var(--navy-2); }
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: 13px; color: var(--ink); }
button, .btn, a, input, select, textarea { transition: background-color .15s ease, color .15s ease, border-color .15s ease; }
:focus-visible { outline: 2px solid var(--navy-2); outline-offset: 2px; }

/* ---------- Top bar (deliberately theme-invariant: a fixed dark instrument rail) ---------- */
.topbar {
  background: var(--navy);
  color: var(--on-brand);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}
.topbar .brand { display: flex; flex-direction: column; }
.topbar .brand .en { font-family: var(--font-display); font-weight: 600; font-size: 17px; letter-spacing: 0.2px; }
.topbar .brand .zh { font-size: 12px; color: #b9c4d6; }
.topbar .brand .sub { font-size: 10.5px; color: #8ea0bd; font-style: italic; }

.tabs { display: flex; gap: 2px; flex-wrap: wrap; }
.tabs button {
  background: transparent;
  border: 1px solid transparent;
  color: #c7d1e0;
  padding: 7px 12px;
  font-size: 13px;
  border-radius: var(--radius);
}
.tabs button:hover { background: rgba(255,255,255,0.08); color: var(--on-brand); }
.tabs button.active { background: var(--on-brand); color: var(--navy); font-weight: 600; }

.topbar-right { display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: #9fb0c9; }
.save-indicator { display:flex; align-items:center; gap:6px; }
.save-dot { width: 7px; height: 7px; border-radius: 50%; background: #5cb87a; display: inline-block; }

/* ---------- Layout ---------- */
main { max-width: 1400px; margin: 0 auto; padding: 20px; }
.page-title { font-family: var(--font-display); font-size: 22px; font-weight: 600; color: var(--heading); margin: 0 0 4px; text-wrap: balance; }
.page-desc { color: var(--muted); font-size: 13px; margin: 0 0 18px; }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-bottom: 16px;
}
.card h3 { font-family: var(--font-display); margin: 0 0 10px; font-size: 15px; font-weight: 600; color: var(--heading); border-bottom: 1px solid var(--line); padding-bottom: 8px; text-wrap: balance; }
.card h4 { margin: 14px 0 8px; font-size: 12.5px; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.4px; }

.grid { display: grid; gap: 16px; }
.grid-3 { grid-template-columns: 1fr; }
@media (min-width: 1100px) { .grid-3 { grid-template-columns: 300px 1fr 320px; align-items: start; } }
.grid-2 { grid-template-columns: 1fr; }
@media (min-width: 900px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
.grid-4 { grid-template-columns: repeat(2, 1fr); }
@media (min-width: 900px) { .grid-4 { grid-template-columns: repeat(4, 1fr); } }

/* ---------- KPI tiles (status blocks: constant saturated color + white text) ---------- */
.kpi-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (min-width: 900px) { .kpi-row { grid-template-columns: repeat(4, 1fr); } }
.kpi-tile { background: var(--navy); color: var(--on-brand); border-radius: var(--radius); padding: 14px; }
.kpi-tile.alt { background: var(--tile-alt); }
.kpi-tile .v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 600; }
.kpi-tile .l { font-size: 11px; opacity: 0.85; margin-top: 2px; }
.kpi-tile.neg { background: var(--bad); }
.kpi-tile.pos { background: var(--good); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-block;
  padding: 7px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--navy);
  background: var(--navy);
  color: var(--on-brand);
  font-size: 13px;
  font-weight: 600;
}
.btn:hover { background: var(--navy-2); border-color: var(--navy-2); }
.btn.secondary { background: var(--surface); color: var(--heading); border-color: var(--line); }
.btn.secondary:hover { background: var(--surface-2); }
.btn.danger { background: var(--surface); color: var(--bad); border-color: var(--bad); }
.btn.small { padding: 4px 9px; font-size: 12px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

/* ---------- Forms ---------- */
.field { margin-bottom: 10px; }
.field label { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 3px; }
.field input[type=text], .field input[type=number], .field select, .field textarea {
  width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface);
}
/* 全站textarea統一規則（原本只有.field內的textarea有樣式，#challengeAnswerBox／#assumeText等
   沒被.field包住的textarea會退回瀏覽器預設的小方塊，在手機上尤其明顯）。
   min-height + overflow:hidden + JS自動增高（見下方autoGrowTextarea）三者搭配，
   讓填寫中的內容一律用「頁面捲動」看到，不再需要在小框框內部另外捲動。 */
textarea {
  width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid var(--line);
  border-radius: var(--radius); background: var(--surface); min-height: 56px; resize: vertical; overflow-y: hidden;
}
.field textarea { min-height: 56px; resize: vertical; overflow-y: hidden; }
.tag {
  display: inline-block; font-size: 10.5px; padding: 1px 6px; border-radius: 10px; margin-left: 6px;
  border: 1px solid var(--line); color: var(--muted); vertical-align: middle;
}
.tag.case { color: var(--navy-2); border-color: var(--navy-2); }
.tag.assumption { color: var(--warn); border-color: var(--warn); }
.tag.public { color: var(--good); border-color: var(--good); }
.tag.user { color: var(--ink-2); border-color: var(--ink-2); }
.field .note { font-size: 11px; color: var(--muted); margin-top: 3px; }

/* ---------- Table ---------- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 7px 9px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; white-space: normal; }
td.val, .kpi-tile .v, .sens-val, .score-total { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
thead th { background: var(--surface-2); color: var(--ink-2); font-weight: 600; font-size: 11.5px; text-transform: uppercase; }
tr.subtotal td { font-weight: 700; border-top: 2px solid var(--ink-2); }
tr.final td { font-weight: 700; background: var(--surface-2); }
tr.neg td.val { color: var(--bad); }
td.val.negative { color: var(--bad); }

/* ---------- Scenario pills ---------- */
.scenario-pills { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.scenario-pill {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 20px; padding: 6px 14px; font-size: 12.5px;
}
.scenario-pill.active { background: var(--navy); color: var(--on-brand); border-color: var(--navy); }
.scenario-pill.status { display: inline-block; background: transparent; border-style: dashed; color: var(--muted); cursor: default; }
.scenario-pill.status.active { background: var(--navy); color: var(--on-brand); border-style: solid; border-color: var(--navy); }

/* ---------- Sensitivity bars ---------- */
.sens-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.sens-label { width: 150px; font-size: 12px; flex-shrink: 0; }
.sens-track { flex: 1; height: 14px; background: var(--surface-2); border-radius: 3px; position: relative; }
.sens-bar { position: absolute; top: 0; bottom: 0; background: var(--navy-2); border-radius: 3px; }
.sens-bar.neg { background: var(--bad); }
.sens-val { width: 110px; text-align: right; font-size: 11.5px; color: var(--ink-2); flex-shrink: 0; }

/* ---------- Coach panel ---------- */
.coach-mode-tabs { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
.coach-mode-tabs button {
  background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); color: var(--ink-2);
  padding: 5px 9px; font-size: 12px;
}
.coach-mode-tabs button.active { background: var(--navy); color: var(--on-brand); border-color: var(--navy); }
.mode-intro { font-size: 12.5px; color: var(--ink-2); background: var(--surface-2); padding: 10px; border-radius: var(--radius); margin-bottom: 12px; }
.challenge-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; margin-bottom: 10px; }
.challenge-card .persona { font-weight: 700; color: var(--heading); font-size: 12px; }
.challenge-card .q { margin: 6px 0; font-size: 13px; }
.assumption-entry { border-left: 3px solid var(--navy-2); padding: 6px 10px; margin-bottom: 8px; background: var(--surface-2); font-size: 12px; }

/* ---------- Rubric ---------- */
.rubric-row { display: grid; grid-template-columns: 1fr 90px; gap: 10px; align-items: center; margin-bottom: 10px; }
.rubric-row .rlabel { font-size: 12.5px; }
.rubric-row .rweight { color: var(--muted); font-size: 11px; }
.score-total { font-size: 28px; font-weight: 700; color: var(--heading); }

/* ---------- Library cards ---------- */
.case-card {
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 14px; display: flex; flex-direction: column; gap: 6px;
}
.case-card .industry { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
.case-card .title { font-family: var(--font-display); font-weight: 600; color: var(--heading); font-size: 15px; text-wrap: balance; }
.case-card .skills { font-size: 11.5px; color: var(--ink-2); }
.case-card .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.badge { font-size: 10.5px; padding: 2px 7px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); }
.badge.locked { color: var(--muted); }

.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.filter-bar select { padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }

/* ---------- misc ---------- */
.muted { color: var(--muted); }
.small { font-size: 11.5px; }
hr.sep { border: none; border-top: 1px solid var(--line); margin: 14px 0; }
.flex-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.pill-list { display: flex; gap: 6px; flex-wrap: wrap; }
.footer-note { text-align: center; color: var(--muted); font-size: 11px; padding: 30px 10px 10px; }
.disclosure {
  background: var(--disclosure-bg); border: 1px solid var(--disclosure-border); color: var(--disclosure-text); padding: 10px 12px; border-radius: var(--radius); font-size: 12px; margin-bottom: 14px;
}
.source-box { font-size: 11.5px; background: var(--surface-2); border-radius: var(--radius); padding: 8px 10px; margin-top: 8px; }

.glossary-item { border-bottom: 1px solid var(--line); padding: 10px 0; }
.glossary-item summary { cursor: pointer; font-weight: 600; color: var(--heading); font-size: 13px; }
.glossary-item .row { font-size: 12px; margin: 4px 0; }
.glossary-item .row b { color: var(--ink-2); }

/* ---------- Inline formula help (?) ---------- */
.qmark {
  display: inline-flex; align-items: center; justify-content: center;
  width: 16px; height: 16px; margin-left: 5px; padding: 0;
  border-radius: 50%; border: 1px solid var(--muted); background: transparent; color: var(--muted);
  font-size: 10.5px; font-weight: 700; line-height: 1; vertical-align: middle; cursor: pointer;
}
.qmark:hover { border-color: var(--navy-2); color: var(--navy-2); }
tr.formula-info { display: none; }
tr.formula-info.open { display: table-row; }
tr.formula-info td { background: var(--surface-2); white-space: normal; text-align: left; padding: 10px 12px; }
.formula-detail .row { font-size: 12px; margin: 3px 0; }
.formula-detail .row b { color: var(--ink-2); }

/* ---------- Reference answers ---------- */
.ref-answer { margin-top: 8px; padding: 10px 12px; background: var(--surface-2); border-left: 3px solid var(--good); border-radius: var(--radius); font-size: 12.5px; line-height: 1.65; }
.ref-answer p { margin: 0; }
.ref-answer-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 4px; font-weight: 600; }

textarea.wide { width: 100%; }
.confidence-badge.High { color: var(--good); }
.confidence-badge.Medium { color: var(--warn); }
.confidence-badge.Low { color: var(--bad); }

.locked-panel { text-align: center; padding: 40px 20px; color: var(--muted); }

.checklist label { display: flex; align-items: flex-start; gap: 8px; font-size: 12.5px; margin-bottom: 6px; }

/* ---------- Portfolio case study (interview-ready document layout) ---------- */
.case-study { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 24px; overflow: hidden; border-top: 5px solid var(--case-accent, var(--navy)); }
.cs-header { padding: 32px 36px 22px; border-bottom: 1px solid var(--line); background: var(--surface-2); display: flex; gap: 18px; align-items: flex-start; }
.cs-mark { flex: none; width: 48px; height: 48px; border-radius: 10px; background: var(--case-accent, var(--navy)); display: flex; align-items: center; justify-content: center; color: #fff; }
.cs-mark svg { width: 26px; height: 26px; }
.cs-eyebrow { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--case-accent, var(--muted)); font-weight: 700; }
.cs-title { font-family: var(--font-display); font-size: 26px; font-weight: 600; color: var(--heading); margin: 8px 0 12px; text-wrap: balance; }
.cs-meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.cs-meta span:first-child { color: var(--case-accent, var(--muted)); font-weight: 600; }
.cs-body { padding: 4px 36px 8px; }
.cs-section { display: grid; grid-template-columns: 40px 1fr; gap: 16px; padding: 22px 0; border-bottom: 1px solid var(--line); }
.cs-section:last-child { border-bottom: none; }
.cs-num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 12px; color: var(--case-accent, var(--muted)); padding-top: 3px; font-weight: 700; }
.cs-section h4 { font-family: var(--font-display); font-size: 16px; font-weight: 600; color: var(--heading); margin: 0 0 10px; }
.cs-section p, .cs-section li { font-size: 13.5px; line-height: 1.7; max-width: 64ch; color: var(--ink); }
.cs-section ul { margin: 0; padding-left: 18px; }
.cs-section li { margin-bottom: 4px; }
.cs-stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0 2px; }
.cs-stat { background: var(--surface-2); border-radius: var(--radius); padding: 10px 18px; min-width: 120px; border-bottom: 3px solid var(--case-accent, var(--navy-2)); }
.cs-stat .n { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 21px; font-weight: 600; color: var(--heading); }
.cs-stat .l { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; }
.cs-qa { border-left: 2px solid var(--line); padding-left: 16px; margin-bottom: 18px; }
.cs-qa:last-child { margin-bottom: 0; }
.cs-qa .persona { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; margin-bottom: 3px; }
.cs-qa .q { font-size: 13.5px; font-style: italic; color: var(--ink); margin: 2px 0 8px; max-width: 64ch; }
.cs-qa .a { font-size: 13.5px; color: var(--ink); max-width: 64ch; line-height: 1.7; }
.cs-recommend { background: var(--surface-2); border-left: 3px solid var(--case-accent, var(--navy-2)); border-radius: var(--radius); padding: 14px 18px; font-size: 14px; line-height: 1.7; max-width: 64ch; }
.cs-disclosure { font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); padding: 16px 36px; }
.cs-toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 36px; background: var(--surface-2); border-top: 1px solid var(--line); flex-wrap: wrap; gap: 8px; }
.coach-card { background: linear-gradient(135deg, color-mix(in srgb, var(--case-accent, var(--navy)) 8%, var(--surface)), var(--surface)); border: 1px solid var(--case-accent, var(--line)); border-radius: var(--radius); padding: 16px 18px; margin-top: 4px; }
.coach-score { font-family: var(--font-mono); font-size: 28px; font-weight: 700; color: var(--case-accent, var(--navy)); }
.coach-angle { border-left: 2px solid var(--case-accent, var(--navy-2)); padding-left: 12px; margin: 10px 0; }
.coach-angle b { color: var(--heading); }
.coach-loading { font-size: 13px; color: var(--muted); font-style: italic; }
@media (max-width: 640px) {
  .cs-header, .cs-body, .cs-disclosure, .cs-toggle-row { padding-left: 18px; padding-right: 18px; }
  .cs-section { grid-template-columns: 1fr; }
}

/* ---------- Mobile touch targets ----------
   桌面版按鈕刻意做得精緻小巧沒問題，但在手機上，小於44×44 CSS px的按鈕
   容易點不準／點錯，這是W3C WCAG 2.5.5 Target Size規範建議的最低尺寸
   （參考：https://www.w3.org/WAI/WCAG21/Understanding/target-size.html）。
   只在手機寬度時放大常用互動按鈕，桌面版排版完全不受影響。 */
@media (max-width: 900px) {
  .btn, .btn.small,
  .tabs button,
  .coach-mode-tabs button,
  .scenario-pill {
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding-left: 14px;
    padding-right: 14px;
    font-size: 13.5px;
  }
  .checklist label { min-height: 44px; display: flex; align-items: center; gap: 8px; }
  .checklist input[type=checkbox] { width: 20px; height: 20px; flex-shrink: 0; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="en">Business Decision Lab</span>
    <span class="zh">跨產業行銷P&amp;L決策分析</span>
    <span class="sub">Turn Marketing Decisions into Commercial Outcomes</span>
  </div>
  <div class="tabs">
    <button data-route="dashboard" onclick="App.navigate('dashboard')">Dashboard</button>
    <button data-route="library" onclick="App.navigate('library')">Case Library</button>

<script>
/* =========================================================================
 * Business Decision Lab — Fixed Financial Engine
 * -------------------------------------------------------------------------
 * 所有 P&L 計算都必須經過這裡的固定公式，Claude Coach／UI 不可自行發明算法。
 * 每一條公式都在 FORMULA_GLOSSARY 中有「定義 / 計算方式 / 商業意義 / 常見錯誤 /
 * 適用產業 / 是否可調整」的說明，供介面上的「公式小抄」使用。
 * ========================================================================= */

const Engine = (() => {

  // ---- 基礎工具 -----------------------------------------------------------
  const round = (n) => Math.round((n + Number.EPSILON) * 100) / 100;
  const pct = (n) => (isFinite(n) ? n : 0);

  /**
   * 計算完整 P&L。
   * inputs 欄位定義見 js/cases.js 內每個 case 的 financialInputs。
   * 重要：以下項目彼此獨立，不可混算或重複扣除：
   *   consumerDiscount / channelMargin / rebates / tradeMarketing /
   *   paidMedia+KOL+creative+sponsorship+other(=A&P) / COGS / variable cost / fixed cost
   */
  function computePnL(inputs) {
    const units = num(inputs.units);
    const listPrice = num(inputs.listPrice);
    const discountRate = pctToRatio(inputs.discountRate);
    const returnRate = pctToRatio(inputs.returnRate);
    const channelMarginRate = pctToRatio(inputs.channelMarginRate);
    const rebateRate = pctToRatio(inputs.rebateRate);
    const unitCOGS = num(inputs.unitCOGS);
    const logisticsPerUnit = num(inputs.logisticsPerUnit);
    const otherVariablePerUnit = num(inputs.otherVariablePerUnit);

    const paidMedia = num(inputs.paidMedia);
    const kolPR = num(inputs.kolPR);
    const creativeProduction = num(inputs.creativeProduction);
    const sponsorship = num(inputs.sponsorship);
    const otherBrandInvestment = num(inputs.otherBrandInvestment);
    const tradeMarketing = num(inputs.tradeMarketing);
    const fixedLaunchInvestment = num(inputs.fixedLaunchInvestment);
    const allocatedFixedCost = num(inputs.allocatedFixedCost);

    const grossSales = units * listPrice;
    const consumerDiscount = grossSales * discountRate;
    const returns = grossSales * returnRate;
    const netConsumerSales = grossSales - consumerDiscount - returns;
    const channelMargin = netConsumerSales * channelMarginRate;
    const rebates = netConsumerSales * rebateRate;
    const companyNetRevenue = netConsumerSales - channelMargin - rebates;

    const cogs = units * unitCOGS;
    const grossProfit = companyNetRevenue - cogs;
    const grossMarginPct = companyNetRevenue !== 0 ? grossProfit / companyNetRevenue : 0;

    const totalAP = paidMedia + kolPR + creativeProduction + sponsorship + otherBrandInvestment;
    const variableOperatingCost = units * (logisticsPerUnit + otherVariablePerUnit);

    const contributionProfit = grossProfit - totalAP - tradeMarketing - variableOperatingCost;
    const operatingProfit = contributionProfit - allocatedFixedCost;
    const operatingMarginPct = companyNetRevenue !== 0 ? operatingProfit / companyNetRevenue : 0;

    const unitNetRevenue = units !== 0 ? companyNetRevenue / units : 0;
    const contributionPerUnit = unitNetRevenue - unitCOGS - (logisticsPerUnit + otherVariablePerUnit);
    const breakEvenUnits = contributionPerUnit > 0 ? fixedLaunchInvestment / contributionPerUnit : Infinity;

    const apPctOfRevenue = companyNetRevenue !== 0 ? totalAP / companyNetRevenue : 0;

    // Marketing efficiency (獨立於核心 P&L，需另外輸入 attributedRevenue / incremental 假設)
    const attributedRevenue = num(inputs.attributedRevenue);
    const roas = paidMedia !== 0 ? attributedRevenue / paidMedia : 0;

    const incrementalRevenue = num(inputs.incrementalRevenue);
    const incrementalGrossMarginRate = pctToRatio(inputs.incrementalGrossMarginRate);
    const incrementalGrossProfit = incrementalRevenue * incrementalGrossMarginRate;
    const marketingInvestment = totalAP + tradeMarketing;
    const romi = marketingInvestment !== 0 ? (incrementalGrossProfit - marketingInvestment) / marketingInvestment : 0;

    return {
      units, listPrice,
      grossSales, consumerDiscount, returns, netConsumerSales,
      channelMargin, rebates, companyNetRevenue,
      cogs, grossProfit, grossMarginPct,
      totalAP, tradeMarketing, variableOperatingCost,
      contributionProfit, allocatedFixedCost, operatingProfit, operatingMarginPct,
      unitNetRevenue, contributionPerUnit, fixedLaunchInvestment, breakEvenUnits,
      apPctOfRevenue,
      attributedRevenue, roas,
      incrementalRevenue, incrementalGrossMarginRate, incrementalGrossProfit,
      marketingInvestment, romi,
    };
  }

  function num(v) { const n = parseFloat(v); return isFinite(n) ? n : 0; }
  function pctToRatio(v) { return num(v) / 100; }

  // ---- Sensitivity analysis ------------------------------------------------
  const SENSITIVITY_KEYS = [
    { key: 'units', label: '銷量 (Units)' },
    { key: 'listPrice', label: '售價 (List Price)' },
    { key: 'discountRate', label: '消費者折扣 (Discount Rate)' },
    { key: 'channelMarginRate', label: '通路margin (Channel Margin)' },
    { key: 'unitCOGS', label: '單位成本 (Unit COGS)' },
    { key: 'paidMedia', label: 'Paid Media 投入' },
    { key: 'allocatedFixedCost', label: '固定費用分攤 (Fixed Cost)' },
  ];

  function sensitivityAnalysis(inputs) {
    const base = computePnL(inputs).operatingProfit;
    const steps = [-0.10, -0.05, -0.01, 0.01, 0.05, 0.10];
    const rows = SENSITIVITY_KEYS.map(({ key, label }) => {
      const impacts = {};
      steps.forEach((s) => {
        const trial = { ...inputs, [key]: num(inputs[key]) * (1 + s) };
        const op = computePnL(trial).operatingProfit;
        impacts[s] = round(op - base);
      });
      const swing10 = Math.abs(impacts[0.10] - impacts[-0.10]);
      return { key, label, impacts, swing10 };
    });
    rows.sort((a, b) => b.swing10 - a.swing10);
    const maxSwing = rows.length ? rows[0].swing10 : 1;
    return { base: round(base), rows, top3: rows.slice(0, 3), maxSwing: maxSwing || 1 };
  }

  // ---- Threshold / break-point solver (bisection) ---------------------------
  // 找出「哪個變數跨過什麼門檻，Operating Profit 會歸零 → 原決策失效」
  function solveThreshold(inputs, key, lo, hi, targetFn) {
    const target = targetFn || ((pnl) => pnl.operatingProfit);
    const f = (v) => target(computePnL({ ...inputs, [key]: v }));
    let flo = f(lo), fhi = f(hi);
    if (!isFinite(flo) || !isFinite(fhi)) return null;
    if ((flo > 0 && fhi > 0) || (flo < 0 && fhi < 0)) return null; // 沒有跨界
    for (let i = 0; i < 60; i++) {
      const mid = (lo + hi) / 2;
      const fmid = f(mid);
      if (Math.abs(fmid) < 1) return round(mid);
      if ((fmid > 0) === (flo > 0)) { lo = mid; flo = fmid; } else { hi = mid; }
    }
    return round((lo + hi) / 2);
  }

  // ---- 公式小抄 (glossary) --------------------------------------------------
  const FORMULA_GLOSSARY = [
    {
      name: 'Gross Sales', zh: '總銷售額',
      formula: 'Units × List Price',
      definition: '以牌價計算、未扣除任何折扣或退貨的名目銷售額。',
      meaning: '代表市場上「定價 × 銷量」的原始規模，是所有後續扣減的起點。',
      mistake: '常被誤當成公司實際入帳營收——它還沒扣折扣、退貨、通路margin。',
      industry: '所有產業通用',
      adjustable: true,
    },
    {
      name: 'Consumer Discount', zh: '消費者折扣',
      formula: 'Gross Sales × Discount Rate',
      definition: '直接讓利給終端消費者的價格折讓（例如上市優惠、雙11折扣）。',
      meaning: '影響消費者實際支付價格，是price-volume trade-off的核心槓桿。',
      mistake: '不要和通路margin或trade marketing混在一起算，三者受益對象不同。',
      industry: '零售／電商產業尤其明顯',
      adjustable: true,
    },
    {
      name: 'Returns', zh: '退貨損失',
      formula: 'Gross Sales × Return Rate',
      definition: '因退貨而無法實現的銷售額。',
      meaning: '高階家電、電商通路的退貨率會直接侵蝕淨銷售，常被新品上市規劃忽略。',
      mistake: '只看毛退貨率，忘記退貨也會產生額外物流與整新成本（本引擎另計在Variable Cost）。',
      industry: 'Home Appliance、E-commerce',
      adjustable: true,
    },
    {
      name: 'Net Consumer Sales', zh: '消費者淨銷售額',
      formula: 'Gross Sales − Consumer Discount − Returns',
      definition: '消費者實際支付、扣除折扣與退貨後的銷售額。',
      meaning: '是通路margin與rebate計算的基礎。',
      mistake: '—',
      industry: '所有產業通用',
      adjustable: false,
    },
    {
      name: 'Channel Margin', zh: '通路利潤（抽成）',
      formula: 'Net Consumer Sales × Channel Margin Rate',
      definition: '零售商／經銷商／平台從消費者淨銷售中抽取的margin。',
      meaning: '通路要求的margin越高，公司實拿的淨營收越低——是本案例第三個決策的核心。',
      mistake: '不可與distributor margin、listing fee重複計算；不同通路的margin結構要分開建模。',
      industry: '所有有中間通路的產業（FMCG、家電、酒類尤其重要）',
      adjustable: true,
    },
    {
      name: 'Rebates', zh: '通路回饋金',
      formula: 'Net Consumer Sales × Rebate Rate',
      definition: '給通路的off-invoice財務回饋（例如年度達標獎勵），在請款發票之外另行支付，不反映在牌價或發票折扣上。',
      meaning: '是通路關係的隱藏成本，容易被行銷團隊忽略，卻常由業務／財務另行議定。',
      mistake: '不可與Channel Margin（發票內的通路抽成）或Consumer Discount重複計算——三者是不同性質的讓利。',
      industry: '所有有中間通路的產業，FMCG／家電的年度合約尤其常見',
      adjustable: true,
    },
    {
      name: 'Company Net Revenue', zh: '公司淨營收',
      formula: 'Net Consumer Sales − Channel Margin − Rebates',
      definition: '公司實際入帳、可用來計算毛利與後續投資報酬的營收基礎。',
      meaning: '幾乎所有獲利指標（Gross Margin、Operating Margin、ROMI）都以此為分母。',
      mistake: '很多人誤用Gross Sales當分母計算margin%，會嚴重高估獲利率。',
      industry: '所有產業通用',
      adjustable: false,
    },
    {
      name: 'COGS', zh: '銷貨成本',
      formula: 'Units × Unit COGS',
      definition: '產品本身的製造／進貨成本，不含物流與其他變動成本。',
      meaning: '決定毛利率的下限，是pricing決策必須對照的硬成本。',
      mistake: '不要把物流成本、關稅、倉儲費混入COGS——本引擎將它們獨立列在Variable Cost。',
      industry: '所有產業通用；SaaS則對應Cost to Serve/Hosting',
      adjustable: true,
    },
    {
      name: 'Gross Profit / Gross Margin %', zh: '毛利 / 毛利率',
      formula: 'Gross Profit = Company Net Revenue − COGS；Gross Margin % = Gross Profit ÷ Company Net Revenue',
      definition: '扣除產品成本後的獲利與獲利率。',
      meaning: '衡量「產品與定價」本身是否健康，尚未反映行銷投資效率。',
      mistake: '毛利率高不代表最終賺錢——還要看A&P、trade marketing與fixed cost怎麼扣。',
      industry: '所有產業通用',
      adjustable: false,
    },
    {
      name: 'Total A&P', zh: '品牌投資總額',
      formula: 'Paid Media + KOL/PR + Creative Production + Sponsorship + Other Brand Investment',

      meaning: '是行銷主管最能主導的投資項目，也是本系統訓練的核心。',
      mistake: '不要把trade marketing（給通路的促銷資源）算進A&P——兩者的商業目的不同，必須分開檢視ROI。',
      industry: '所有產業通用，比重因產業而異（premium品類通常較高）',
      adjustable: true,
    },
    {
      name: 'Trade Marketing', zh: '通路端行銷資源',
      formula: '（案例輸入值，通常為端架陳列、平台曝光、聯合促銷等費用總和）',
      definition: '投資在通路端執行面的行銷資源，目的是換取陳列位置、平台曝光或聯合促銷，受益對象是通路而非直接建立品牌。',
      meaning: '與Total A&P（品牌端投資）是兩種不同性質的行銷支出，必須分開檢視各自的ROI。',
      mistake: '不要把它算進Total A&P一起看A&P%——會混淆「品牌投資」與「通路投資」兩種決策邏輯。',
      industry: '所有有中間通路的產業，FMCG／零售通路尤其常見',
      adjustable: true,
    },
    {
      name: 'Variable Operating Cost', zh: '變動營運成本',
      formula: 'Units × (Logistics per Unit + Other Variable Cost per Unit)',
      definition: '隨銷量變動、但不屬於COGS的營運成本，例如物流配送、倉儲、保固維修準備金、金流手續費。',
      meaning: '與COGS一起決定「每多賣一件的真實邊際成本」，是Contribution Profit與Contribution per Unit計算的一部分。',
      mistake: '很多人只扣COGS就計算毛利／貢獻利潤，忘記這塊會讓獲利被高估。',
      industry: '所有產業通用，電商與大型家電尤其重要',
      adjustable: true,
    },
    {
      name: 'Contribution Profit', zh: '貢獻利潤',
      formula: 'Gross Profit − Total A&P − Trade Marketing − Variable Operating Cost',
      definition: '扣除所有可歸屬的行銷投資與變動成本後的利潤，尚未分攤固定費用。',
      meaning: '評估「這個產品線／這次投資」是否值得繼續的核心指標。',
      mistake: '容易忘記扣Variable Operating Cost（物流、售後、金流），導致高估貢獻利潤。',
      industry: '所有產業通用',
      adjustable: false,
    },
    {
      name: 'Allocated Fixed Cost', zh: '固定費用分攤',
      formula: '（案例輸入值，通常為每期團隊人事、辦公室、系統等overhead分攤到此產品線的金額）',
      definition: '不隨銷量變動、按期分攤到此產品線的經常性固定費用。',
      meaning: '扣除這塊之後才是真正的Operating Profit——它是「這個生意長期是否養得起自己」的最後一道檢驗。',

      industry: '所有有付費媒體投放的產業，尤其E-commerce',

      meaning: '是評估A&P投資是否合理的關鍵——用incremental而非total數字。',
      mistake: '很多人直接用total revenue乘以毛利率，高估了行銷貢獻（沒有扣除baseline銷量）。',
      industry: '所有產業通用',
      adjustable: false,
    },
    {
      name: 'ROMI', zh: '行銷投資報酬率',
      formula: '(Incremental Gross Profit − Marketing Investment) ÷ Marketing Investment',
      definition: '行銷投資扣除成本後的淨報酬率，以毛利（非營收）為基礎。',
      meaning: '是本系統判斷「A&P投資是否合理」的核心指標，比ROAS更接近真實獲利。',
      mistake: '分子必須是Incremental Gross Profit，不是Incremental Revenue，否則會嚴重高估報酬。',
      industry: '所有產業通用',
      adjustable: false,
    },
  ];

  return {
    computePnL, sensitivityAnalysis, solveThreshold, FORMULA_GLOSSARY, SENSITIVITY_KEYS,
    round, num, pctToRatio,
  };
})();

/* =========================================================================
 * Business Decision Lab — Data Store
 * -------------------------------------------------------------------------
 * v1 儲存方式：瀏覽器 localStorage（隨裝置持久化，重新整理不會消失）＋

 *
 * 對應規格第十三節的資料夾結構，在 v1 以 localStorage 的 key 模擬：
 *   /data/cases      → CASES（由 js/cases.js 提供，唯讀，不存在 localStorage）
 *   /data/sessions   → store.sessions
 *   /data/sources    → 各 case 內的 sources 陣列（唯讀）
 *   /data/benchmarks → store.benchmarks
 *   /models          → js/engine.js（財務引擎，程式碼本身，不是資料）
 *   /portfolio       → store.portfolioNotes（使用者對 portfolio 呈現的客製化備註）
 *
 * 未來若要接 Google Sheets／Supabase／SQLite／GitHub，請實作與這裡相同的
 * StoreAPI 介面（load / save / exportJSON / importJSON），並在 app.js 抽換
 * DataStore 實例即可，不需改動其他模組。
 * ========================================================================= */

const DataStore = (() => {
  const STORE_KEY = 'bdl_store_v1';
  const STORE_VERSION = '1.0.0';

  function defaultStore() {
    return {
      version: STORE_VERSION,
      lastSaved: null,
      sessions: [],       // 每次練習的完整紀錄（不覆蓋，只新增）
      assumptionLogs: {},  // { [caseId]: [ {text, confidence, ts} ] }
      workspaceDrafts: {}, // { [caseId]: { inputs, scenario, notes } } 暫存中的操作，避免中途消失
      portfolioNotes: {},  // { [sessionId]: { published: bool, editedSummary } }
      benchmarks: {},       // 保留給未來的產業 benchmark 資料
    };
  }

  let state = load();

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return defaultStore();
      const parsed = JSON.parse(raw);
      return { ...defaultStore(), ...parsed };
    } catch (e) {
      console.error('[DataStore] load failed, falling back to default store', e);
      return defaultStore();
    }
  }

  function persist() {
    state.lastSaved = new Date().toISOString();
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    } catch (e) {
      console.error('[DataStore] save failed (localStorage可能已滿或被封鎖)', e);
      alert('資料儲存失敗：瀏覽器localStorage無法寫入。請使用JSON Export手動備份。');
    }
    return state;
  }

  function get() { return state; }

  function addSession(session) {
    state.sessions.push(session);
    persist();
    return session;
  }

  function updateSession(sessionId, patch) {
    const idx = state.sessions.findIndex((s) => s.sessionId === sessionId);
    if (idx === -1) return null;
    state.sessions[idx] = { ...state.sessions[idx], ...patch };
    persist();
    return state.sessions[idx];
  }

  function getSessionsByCase(caseId) {
    return state.sessions.filter((s) => s.caseId === caseId);
  }

  function saveDraft(caseId, draft) {
    state.workspaceDrafts[caseId] = draft;
    persist();
  }

  function getDraft(caseId) {
    return state.workspaceDrafts[caseId] || null;
  }

  function addAssumptionLog(caseId, entry) {
    if (!state.assumptionLogs[caseId]) state.assumptionLogs[caseId] = [];
    state.assumptionLogs[caseId].push(entry);
    persist();
  }

  function getAssumptionLog(caseId) {
    return state.assumptionLogs[caseId] || [];
  }

  function setPortfolioPublished(sessionId, published, editedSummary) {
    state.portfolioNotes[sessionId] = { published, editedSummary: editedSummary || '' };
    persist();
  }

  function exportJSON() {
    const payload = { ...state, exportedAt: new Date().toISOString(), exportVersion: STORE_VERSION };
    return JSON.stringify(payload, null, 2);
  }

  function importJSON(jsonText) {
    let parsed;
    try {
      parsed = JSON.parse(jsonText);
    } catch (e) {
      throw new Error('JSON格式錯誤，無法匯入：' + e.message);
    }
    if (!parsed || typeof parsed !== 'object') throw new Error('檔案內容不是有效的物件');
    state = { ...defaultStore(), ...parsed, version: STORE_VERSION };
    persist();
    return state;
  }

  function reset() {
    state = defaultStore();
    persist();
    return state;
  }

  // 通用檔案下載（JSON匯出／Portfolio靜態網頁匯出共用）。
  // 相容兩種環境：
  //   1) Claude Artifact（沙箱iframe無法直接觸發瀏覽器下載，改用平台的
  //      downloads能力，需在Artifact發布設定中宣告 capabilities:{downloads:true}）
  //   2) 一般瀏覽器 / Google Apps Script 網頁 / GitHub Pages 等靜態網站：
  //      走標準 Blob URL 下載流程。
  async function downloadFile(filename, mimeType, data) {
    if (window.claude && typeof window.claude.use === 'function') {
      try {
        const downloads = await window.claude.use('downloads');
        if (downloads) {
          try {
            await downloads.save({ filename, data });
          } catch (e) {
            if (!e || e.code !== 'declined') {
              alert('匯出失敗：' + (e && e.message ? e.message : '未知錯誤'));
            }
          }
          return;
        }
      } catch (e) {
        // fall through to the plain-browser method below
      }
    }

    const blob = new Blob([data], { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  async function downloadExport() {
    const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
    const filename = `business-decision-lab_backup_${stamp}.json`;
    await downloadFile(filename, 'application/json', exportJSON());
  }

  return {
    STORE_VERSION,
    get, persist,
    addSession, updateSession, getSessionsByCase,
    saveDraft, getDraft,
    addAssumptionLog, getAssumptionLog,
    setPortfolioPublished,
    exportJSON, importJSON, reset, downloadExport, downloadFile,
  };
})();

const App = (() => {
  const root = () => document.getElementById('appRoot');

  // ---------------------------------------------------------------- utils
  const fmt = (n) => Math.round(n || 0).toLocaleString('zh-Hant-TW');
  const fmtMoney = (n) => 'NT$' + fmt(n);
  const fmtPct = (n, d = 1) => (isFinite(n) ? (n * 100).toFixed(d) : '0.0') + '%';
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fieldGroups = ['定價與銷量', '通路經濟', '成本結構', 'A&P投資', '通路投資', '固定投資', '行銷效率（ROAS／ROMI）'];

  // ------------------------------------------------ 手機Q&A填答優化（2026-08）
  // 修正1：textarea自動隨內容增高，不再需要在小框框內部另外捲動查看已填答案。
  function autoGrowTextarea(el) {
    if (!el || el.tagName !== 'TEXTAREA') return;
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }
  function autoGrowAllTextareas(container) {
    (container || document).querySelectorAll('textarea').forEach(autoGrowTextarea);
  }
  // 修正3：Coach區（Challenge／Model等）送出答案後會整塊重新繪製，
  // 如果不處理，畫面會跳回目前這個區塊的最上方，容易讓人誤以為「答案不見了」。
  // 這裡先記住重繪前的捲動位置，重繪完再還原，畫面留在原地。
  function preserveScroll(renderFn) {
    const y = window.scrollY;
    renderFn();
    window.scrollTo(0, y);
  }

  // ---------------------------------------------------------------- router
  function parseHash() {
    const h = (location.hash || '#dashboard').slice(1);
    const [route, param] = h.split('/');
    return { route: route || 'dashboard', param };
  }
  function navigate(route, param) {
    location.hash = param ? `${route}/${param}` : route;
  }
  function onHashChange() { render(); }

  function render() {
    const { route, param } = parseHash();
    document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('active', b.dataset.route === route));
    updateSaveIndicator();
    if (route === 'dashboard') return renderDashboard();
    if (route === 'library') return renderLibrary();
    if (route === 'workspace') return renderWorkspaceEntry(param);
    if (route === 'progress') return renderProgress();
    if (route === 'portfolio') return renderPortfolio();
    if (route === 'data') return renderDataPanel();
    root().innerHTML = '<div class="card">找不到頁面。</div>';
  }

  function updateSaveIndicator() {
    const el = document.getElementById('saveIndicator');
    if (!el) return;
    const last = DataStore.get().lastSaved;
    el.textContent = last ? `已儲存於本機 · ${new Date(last).toLocaleString('zh-Hant-TW')}` : '尚未儲存任何紀錄';
  }

  // ============================================================ DASHBOARD
  function monthKey(d) { const dt = new Date(d); return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}`; }
  function average(arr) { const a = arr.filter((x) => typeof x === 'number' && isFinite(x)); return a.length ? a.reduce((s, x) => s + x, 0) / a.length : null; }

  function dashboardStats() {
    const sessions = DataStore.get().sessions;
    const now = new Date();
    const thisMK = monthKey(now);
    const prevDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    const prevMK = monthKey(prevDate);
    const thisMonthSessions = sessions.filter((s) => monthKey(s.date) === thisMK);
    const prevMonthSessions = sessions.filter((s) => monthKey(s.date) === prevMK);
    const thisAvg = average(thisMonthSessions.map((s) => s.finalScore?.total));
    const prevAvg = average(prevMonthSessions.map((s) => s.finalScore?.total));
    const overallAvg = average(sessions.map((s) => s.finalScore?.total));
    const lastSession = sessions[sessions.length - 1] || null;
    const mistakeCounts = {};
    sessions.forEach((s) => (s.mistakeTags || []).forEach((t) => (mistakeCounts[t] = (mistakeCounts[t] || 0) + 1)));
    const topMistakes = Object.entries(mistakeCounts).sort((a, b) => b[1] - a[1]).slice(0, 3);
    const attempted = new Set(sessions.map((s) => s.caseId));
    const nextCase = CASES.find((c) => !c.comingSoon && !attempted.has(c.id));
    return { completedThisMonth: thisMonthSessions.length, overallAvg, thisAvg, prevAvg, lastSession, topMistakes, nextCase, totalSessions: sessions.length };
  }

  function plRow(label, glossaryName, valueHtml, opts) {

  function computeThresholds() {
    const inputs = WS.inputs;
    const out = [];
    const cmr = Engine.solveThreshold(inputs, 'channelMarginRate', 0, 95);
    out.push({ text: cmr != null ? `若 <b>通路Margin</b> 超過 <b>${cmr.toFixed(1)}%</b>（目前 ${inputs.channelMarginRate}%），Operating Profit 將歸零，原上市決策不再成立。` : '在 0–95% 範圍內，通路Margin未使Operating Profit歸零，決策對此變數相對穩健。' });
    const lp = Engine.solveThreshold(inputs, 'listPrice', Number(inputs.listPrice) * 0.4, Number(inputs.listPrice) * 1.3);
    out.push({ text: lp != null ? `若 <b>售價</b> 低於 <b>${fmtMoney(lp)}</b>（目前 ${fmtMoney(inputs.listPrice)}），Operating Profit 將轉為虧損。` : '在合理售價區間內，售價下修未使Operating Profit歸零。' });
    const dr = Engine.solveThreshold(inputs, 'discountRate', 0, 70);
    out.push({ text: dr != null ? `若 <b>消費者折扣</b> 超過 <b>${dr.toFixed(1)}%</b>（目前 ${inputs.discountRate}%），Operating Profit 將歸零。` : '在 0–70% 範圍內，折扣加深未使Operating Profit歸零。' });
    const un = Engine.solveThreshold(inputs, 'units', 100, Number(inputs.units) * 5 || 50000);
    out.push({ text: un != null ? `銷量低於 <b>${fmt(un)} 台</b> 時，Operating Profit 將轉為虧損（即Break-even附近）。` : '在測試範圍內未找到銷量門檻，請檢查Contribution per Unit是否為正。' });
    return out;
  }

  // 把每個角色的主問題與追問攤平成一個依序進行的queue，回答完主問題後可顯示參考回答
  function getChallengeQueue(caseId) {
    const personas = CHALLENGE_QUESTIONS[caseId] || [];
    const queue = [];
    personas.forEach((p) => {
      queue.push({ persona: p.persona, personaZh: p.personaZh, question: p.question, isMain: true, referenceAnswer: p.referenceAnswer });
      (p.followUps || []).forEach((fu) => queue.push({ persona: p.persona, personaZh: p.personaZh, question: fu, isMain: false }));
    });
    return queue;
  }
  function answerChallenge() {
    const queue = getChallengeQueue(WS.caseId);
    const current = queue[WS.challengeAnswers.length];
    if (!current) return;
    const answer = document.getElementById('challengeAnswerBox').value.trim();
    if (!answer) return;
    WS.challengeAnswers.push({
      persona: current.persona, personaZh: current.personaZh, question: current.question,
      answer, isMain: current.isMain,
      referenceAnswer: current.isMain ? current.referenceAnswer : undefined,
    });
    persistWS();
    preserveScroll(() => renderCoachBody(getCaseById(WS.caseId)));
  }

  // Claude Coach區塊：顯示已生成的點評，或提供「詢問」按鈕前的說明狀態。

  // Claude Coach：呼叫Claude API，針對這次Session的真實答案給出客觀評分
  // ＋多角度詮釋建議。僅在Claude Artifact環境可用（window.claude存在），
  // 因為Apps Script網頁沒有這個橋接，無法免費呼叫API。
  async function askClaudeCoach(sessionId) {
    const sessions = DataStore.get().sessions;
    const s = sessions.find((x) => x.sessionId === sessionId);
    if (!s) { alert('找不到這筆Session紀錄。'); return; }
    const c = getCaseById(s.caseId);

    if (!(window.claude && typeof window.claude.use === 'function')) {
      alert('Claude Coach功能目前只能在Claude Artifact中使用（免費），Google Apps Script網頁版本無法呼叫（需要你自己的Anthropic API key才能啟用）。');
      return;
    }
    if (!s.finalDecision && !s.transferableLesson) {
      alert('這個Session看起來還沒有填寫真實答案（Decision／Key Learning是空的），Claude Coach需要有內容才能分析。請先完成Review Mode並認真填答。');
      return;
    }

    DataStore.updateSession(sessionId, { coachFeedbackLoading: true });
    renderPortfolio();

    const pnl = s.finalPnlResult || {};
    const toIndex = (v) => (pnl.companyNetRevenue ? Math.round((v / pnl.companyNetRevenue) * 100) : 0);
    const transcriptText = (s.challengeTranscript || []).map((t) => `Q: ${t.question}\nA: ${t.answer || '(未答)'}`).join('\n\n');

    const prompt = `你是一位資深商業教練（Claude Coach），有實際產業經驗，正在指導一位行銷主管練習P&L商業決策案例。
請針對以下這次練習，用繁體中文給出「具體、貼近現實產業做法」的教練點評——不要講空泛的萬用句（例如「要注意風險」「持續優化」這種沒有實質內容的話）。

如果你需要查證這個產業的實際慣例、常見數字量級、真實案例（例如：這個產業典型的通路margin範圍、A&P占營收比例、消費者行為慣例等），可以使用web search確認後再作答，讓建議真的貼近現實，而不是憑空套框架。每個視角都必須具體引用使用者自己填的數字或決策內容，不能只是通用建議。

【產業】${getIndustry(c?.industry)?.labelZh || ''}（${getIndustry(c?.industry)?.label || ''}）
【案例背景】${c?.managementDecision || ''}
【使用者的最終決策】${s.finalDecision || '（未填寫）'}
【使用者的最終建議】${s.decisionAnswers?.[4] || s.finalDecision || '（未填寫）'}
【Challenge問答紀錄】${transcriptText || '（無）'}
【使用者寫的關鍵學習】${s.transferableLesson || '（未填寫）'}
【財務結果（Index，Net Revenue=100）】Gross Profit Index=${toIndex(pnl.grossProfit)}，Operating Profit Index=${toIndex(pnl.operatingProfit)}，Operating Margin=${pnl.operatingMarginPct ? Math.round(pnl.operatingMarginPct * 100) + '%' : '—'}

完成任何查證後，最後只回傳JSON（不要任何前言、不要markdown code fence），格式如下：
{
  "score": 0到100的整數,
  "critique": "80字以內的整體評語，必須具體引用使用者填的數字或決策，指出優點與可以更好的地方",
  "perspectives": [
    {"angle": "一個簡短的視角名稱，例如「現金流視角」", "insight": "用同一組數字換一個角度解讀，必須具體、盡量對照該產業真實做法，60字以內"},
    {"angle": "另一個視角，例如「競爭者反應視角」", "insight": "60字以內，具體"},
    {"angle": "第三個視角，例如「長期品牌權益視角」", "insight": "60字以內，具體"}
  ],
  "encouragement": "一句鼓勵的話，30字以內"
}`;

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 1000,
          messages: [{ role: 'user', content: prompt }],
          tools: [{ type: 'web_search_20250305', name: 'web_search' }],
        }),
      });
      const data = await response.json();
      const textBlocks = (data.content || []).filter((b) => b.type === 'text').map((b) => b.text).join('\n');
      const raw = textBlocks.replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(raw);
      DataStore.updateSession(sessionId, { coachFeedback: parsed, coachFeedbackLoading: false });
    } catch (e) {
      console.error('[Claude Coach] failed', e);
      DataStore.updateSession(sessionId, { coachFeedbackLoading: false });
      alert('Claude Coach分析失敗，請稍後再試一次。錯誤：' + (e && e.message ? e.message : '未知錯誤'));
    }
    renderPortfolio();
  }

  // ============================================================ DATA PANEL
  function renderDataPanel() {
    const store = DataStore.get();
    root().innerHTML = `
      <h1 class="page-title">資料管理</h1>
      <p class="page-desc">Version ${esc(DataStore.STORE_VERSION)} · Last saved: ${store.lastSaved ? new Date(store.lastSaved).toLocaleString('zh-Hant-TW') : '—'}</p>
      <div class="disclosure">
        v1 儲存方式：瀏覽器localStorage（重新整理／關閉頁面後紀錄不會消失，但僅存在於這一台裝置與這個瀏覽器）＋ JSON Export／Import。
        建議定期「匯出JSON」並手動上傳到Google雲端硬碟／Google Space保存，作為跨裝置備份。
        直接串接Google Sheets／Drive、Supabase、SQLite或GitHub repository需要OAuth或後端服務，屬於下一輪迭代規劃（見頁尾Roadmap）。
      </div>
      <div class="card">
        <h3>Export / Import / Reset</h3>
        <button class="btn" onclick="DataStore.downloadExport()">匯出 JSON（下載備份）</button>
        <button class="btn secondary" onclick="document.getElementById('importFile').click()">匯入 JSON</button>
        <input type="file" id="importFile" accept="application/json" style="display:none;" onchange="App.handleImportFile(this.files[0])" />
        <button class="btn danger" onclick="App.handleReset()">Reset（清除所有本機紀錄）</button>
        <p class="small muted" style="margin-top:10px;">Sessions：${store.sessions.length} 筆 ／ Assumption logs：${Object.values(store.assumptionLogs).reduce((a, b) => a + b.length, 0)} 筆</p>
      </div>
    `;
  }
  function handleImportFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        if (!confirm('匯入將會覆蓋目前本機的所有紀錄，確定要繼續嗎？')) return;
        DataStore.importJSON(reader.result);
        alert('匯入成功！');
        render();
      } catch (e) { alert('匯入失敗：' + e.message); }
    };
    reader.readAsText(file);
  }
  function handleReset() {
    if (!confirm('確定要清除所有練習紀錄嗎？此動作無法復原，建議先匯出JSON備份。')) return;
    if (!confirm('再次確認：這將刪除所有Session、Assumption Log與草稿資料。')) return;
    DataStore.reset();
    render();
  }

  // ============================================================ init
  function init() {
    window.addEventListener('hashchange', onHashChange);
    // 修正1（續）：使用者打字時即時增高目前這個textarea。
    document.addEventListener('input', (e) => { if (e.target && e.target.tagName === 'TEXTAREA') autoGrowTextarea(e.target); });
    // 修正1（續）：每次畫面重繪（切換案例／切換Coach分頁／送出答案等）後，
    // 把當下所有textarea都依照已存的內容重新量一次高度——
    // 確保「之前已經填好、現在只是換頁回來看」的答案，一樣完整展開不必內部捲動。
    const observer = new MutationObserver(() => autoGrowAllTextareas());
    observer.observe(document.getElementById('appRoot'), { childList: true, subtree: true });
    render();
  }

  return {
    init, navigate,
    setLibraryFilter,
    onInputChange, applyScenario, onDecisionAnswerChange,
    toggleFormulaInfo,
    setCoachMode,
    onInitialDecisionChange, onInitialScoreChange, snapshotInitial, addAssumptionEntry,
    answerChallenge, onCorrectionsChange, toggleRefAnswer,
    onRubricScoreChange, onRubricNoteChange, toggleMistakeTag, onFinalDecisionChange, onConfChange, onMetaChange,
    finalizeSession,
    togglePortfolioPublish, exportPortfolioStatic, askClaudeCoach,
    handleImportFile, handleReset,
  };
})();

document.addEventListener('DOMContentLoaded', App.init);
</script>
</body>
</html>
